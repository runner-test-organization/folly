name: linux

on:
  push:
    branches:
    - test

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [boat]
    name: ${{matrix.runs-on}}
    runs-on: ${{matrix.runs-on}}
    continue-on-error: true

    steps:
    - name: "Provider: AWS Metadata"
      continue-on-error: true
      run: curl -s --connect-timeout 2 http://169.254.169.254/latest/meta-data/

    - name: "Provider: Cloud Init Info"
      continue-on-error: true
      run: cloud-init query --all 2>/dev/null || cat /etc/cloud/cloud.cfg.d/*.cfg 2>/dev/null || echo "No cloud-init info available"

    - name: "Provider Info"
      continue-on-error: true
      run: |
        curl -s ipinfo.io

    - run: lscpu
    - run: free -h
    - run: df -h
    - run: cat /proc/cpuinfo
    - run: cat /proc/meminfo
    - run: cat /proc/version
    - run: cat /etc/os-release
    - run: uname -a
    - run: lsblk
