# This file was @generated by getdeps.py

name: linux

on:
  push:
    branches:
    - build-test

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [
          # ubuntu-22.04, ubuntu-24.04,
          # ubicloud-standard-2-ubuntu-2204, ubicloud-standard-2-ubuntu-2404,
          # ubicloud-standard-2-arm-ubuntu-2204, ubicloud-standard-4-arm-ubuntu-2204,
          # buildjet-2vcpu-ubuntu-2204, buildjet-2vcpu-ubuntu-2404,
          # buildjet-2vcpu-ubuntu-2204-arm, buildjet-4vcpu-ubuntu-2204-arm,
          # namespace-profile-x64-2x8,
          # namespace-profile-arm64-2x8, namespace-profile-arm64-4x16,
          # warp-ubuntu-latest-x64-2x, warp-ubuntu-2204-x64-2x,
          # warp-ubuntu-2204-arm64-2x, warp-ubuntu-2204-arm64-4x,
          # blacksmith-2vcpu-ubuntu-2204, blacksmith-4vcpu-ubuntu-2204,
          # blacksmith-2vcpu-ubuntu-2204-arm, blacksmith-4vcpu-ubuntu-2204-arm,
          # blacksmith-2vcpu-ubuntu-2204, blacksmith-2vcpu-ubuntu-2404
          ubicloud-standard-2-ubuntu-2404,
          ubicloud-premium-2-ubuntu-2404,
        ]
    name: ${{matrix.runs-on}}
    runs-on: ${{matrix.runs-on}}
    continue-on-error: true
    steps:
    - name: cat /proc/cpuinfo
      run: cat /proc/cpuinfo

    - run: docker version

    - run: docker info

    - name: uname -mr
      run: uname -mr

    - name: nproc
      run: nproc

    - name: lscpu
      run: lscpu

    - name: free -h
      run: free -h

    - name: lsblk
      run: lsblk

    - name: df -Th
      run: df -Th

    - name: Dump context
      uses: crazy-max/ghaction-dump-context@v2

    - name: ip info
      run: curl ipinfo.io

    - name: lspci
      continue-on-error: true
      run: lspci -vv

    - name: printenv
      run: printenv

    - name: install passmark
      run: |
        sudo apt-get update
        sudo apt-get install -y libncurses5 || true
        wget "https://www.passmark.com/downloads/pt_linux_x64.zip" -O pt.zip
        unzip pt.zip

    - name: Bypass libncurses5 dependency
      if: ${{ contains(matrix.runs-on, '2404') }}
      run: |
        sudo ln -s /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
        sudo ln -s /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
        sudo ldconfig

    - name: run passmark
      run: |
        # Run PerformanceTest with 2 proccesses, 2 iterations
        TERM=xterm ./PerformanceTest/PerformanceTest_Linux_x86-64 -p 2 -d 2 -i 2 -r 1

    - name: passmark results
      run: cat results_cpu.yml
