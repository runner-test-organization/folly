name: linux

on:
  push:
    branches:
    - build-test

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [
          # ubuntu-22.04, ubuntu-24.04,
          # ubicloud-standard-2-ubuntu-2204, ubicloud-standard-2-ubuntu-2404,
          # ubicloud-standard-2-arm-ubuntu-2204, ubicloud-standard-4-arm-ubuntu-2204,
          # buildjet-2vcpu-ubuntu-2204, buildjet-2vcpu-ubuntu-2404,
          # buildjet-2vcpu-ubuntu-2204-arm, buildjet-4vcpu-ubuntu-2204-arm,
          # namespace-profile-x64-2x8,
          # namespace-profile-arm64-2x8, namespace-profile-arm64-4x16,
          # warp-ubuntu-latest-x64-2x, warp-ubuntu-2204-x64-2x,
          # warp-ubuntu-2204-arm64-2x, warp-ubuntu-2204-arm64-4x,
          # blacksmith-2vcpu-ubuntu-2204, blacksmith-4vcpu-ubuntu-2204,
          # blacksmith-2vcpu-ubuntu-2204-arm, blacksmith-4vcpu-ubuntu-2204-arm,
          # blacksmith-2vcpu-ubuntu-2204, blacksmith-2vcpu-ubuntu-2404
          ubicloud-standard-2-ubuntu-2204,
          ubicloud-premium-2-ubuntu-2204,
          buildjet-2vcpu-ubuntu-2204,

        ]
    name: ${{matrix.runs-on}}
    runs-on: ${{matrix.runs-on}}
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    # ── 1. System Information ────────────────────────────────────
    - name: "System Info: Kernel & Architecture"
      run: uname -a

    - name: "System Info: CPU Model"
      run: cat /proc/cpuinfo | grep -m1 "model name" || echo "N/A"

    - name: "System Info: CPU Details (lscpu)"
      run: lscpu

    - name: "System Info: Core Count"
      run: nproc

    - name: "System Info: Memory"
      run: free -h

    - name: "System Info: Block Devices"
      run: lsblk

    - name: "System Info: Disk Usage"
      run: df -Th

    - name: "System Info: Docker Version"
      run: docker version

    - name: "System Info: Docker Info"
      run: docker info

    # ── 2. Datacenter / Provider Detection ───────────────────────
    - name: "Provider: IP Info"
      run: curl -s ipinfo.io

    - name: "Provider: AWS Metadata"
      continue-on-error: true
      run: curl -s --connect-timeout 2 http://169.254.169.254/latest/meta-data/

    - name: "Provider: Cloud Init Info"
      continue-on-error: true
      run: cloud-init query --all 2>/dev/null || cat /etc/cloud/cloud.cfg.d/*.cfg 2>/dev/null || echo "No cloud-init info available"

    - name: "Provider: Hardware / Hypervisor"
      continue-on-error: true
      run: sudo dmidecode -s system-manufacturer 2>/dev/null || echo "dmidecode not available"

    - name: "Provider: Environment Variables"
      run: printenv | sort

    - name: "Provider: PCI Devices"
      continue-on-error: true
      run: lspci -vv 2>/dev/null || echo "lspci not available"

    - name: Dump GitHub Actions Context
      uses: crazy-max/ghaction-dump-context@v2

    # ── 3. Install Benchmark Tools ───────────────────────────────
    - name: Install benchmark tools
      run: |
        sudo apt-get update
        sudo apt-get install -y sysbench fio p7zip-full postgresql-client

    # ── 4. CPU Performance ───────────────────────────────────────
    - name: "CPU: sysbench single-thread"
      run: sysbench cpu --threads=1 --time=30 run

    - name: "CPU: sysbench multi-thread"
      run: sysbench cpu --threads=$(nproc) --time=30 run

    - name: "CPU: openssl speed (crypto)"
      run: openssl speed -seconds 10 -multi $(nproc) sha256 aes-256-cbc rsa2048

    - name: "CPU: 7-Zip compression benchmark"
      run: 7z b

    - name: "CPU: Install Passmark (x86 only)"
      if: runner.arch == 'X64'
      run: |
        sudo apt-get install -y libncurses5 || true
        wget -q "https://www.passmark.com/downloads/pt_linux_x64.zip" -O pt.zip
        unzip pt.zip

    - name: "CPU: Bypass libncurses5 (Ubuntu 24.04 x86)"
      if: runner.arch == 'X64' && contains(matrix.runs-on, '2404')
      run: |
        sudo ln -s /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
        sudo ln -s /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
        sudo ldconfig

    - name: "CPU: Run Passmark (x86 only)"
      if: runner.arch == 'X64'
      run: TERM=xterm ./PerformanceTest/PerformanceTest_Linux_x86-64 -p 2 -d 2 -i 2 -r 1

    - name: "CPU: Passmark Results"
      if: runner.arch == 'X64'
      run: cat results_cpu.yml

    # ── 5. Memory Performance ────────────────────────────────────
    - name: "Memory: sysbench read"
      run: sysbench memory --memory-oper=read --threads=$(nproc) --time=30 run

    - name: "Memory: sysbench write"
      run: sysbench memory --memory-oper=write --threads=$(nproc) --time=30 run

    # ── 6. I/O Performance ───────────────────────────────────────
    - name: "I/O: fio sequential write"
      run: |
        fio --name=seq-write --ioengine=libaio --direct=1 --bs=1M \
          --size=1G --numjobs=1 --rw=write --group_reporting --runtime=30 --time_based

    - name: "I/O: fio sequential read"
      run: |
        fio --name=seq-read --ioengine=libaio --direct=1 --bs=1M \
          --size=1G --numjobs=1 --rw=read --group_reporting --runtime=30 --time_based

    - name: "I/O: fio random read 4K (IOPS)"
      run: |
        fio --name=rand-read-4k --ioengine=libaio --direct=1 --bs=4k \
          --size=1G --numjobs=4 --rw=randread --group_reporting --runtime=30 --time_based

    - name: "I/O: fio random write 4K (IOPS)"
      run: |
        fio --name=rand-write-4k --ioengine=libaio --direct=1 --bs=4k \
          --size=1G --numjobs=4 --rw=randwrite --group_reporting --runtime=30 --time_based

    - name: "I/O: fio mixed random read/write 4K"
      run: |
        fio --name=rand-rw-4k --ioengine=libaio --direct=1 --bs=4k \
          --size=1G --numjobs=4 --rw=randrw --rwmixread=70 --group_reporting --runtime=30 --time_based

    - name: "I/O: dd sequential write"
      run: dd if=/dev/zero of=./dd_test bs=1M count=1024 conv=fdatasync 2>&1 && rm -f ./dd_test

    # ── 7. Network Performance ───────────────────────────────────
    - name: "Network: Download speed test"
      run: |
        curl -o /dev/null -w "Download speed: %{speed_download} bytes/sec\nTotal time: %{time_total}s\nSize: %{size_download} bytes\n" \
          https://releases.ubuntu.com/24.04/ubuntu-24.04.2-live-server-amd64.iso.zsync

    - name: "Network: Ping latency (github.com)"
      run: ping -c 10 github.com

    - name: "Network: Ping latency (8.8.8.8)"
      run: ping -c 10 8.8.8.8

    # ── 8. PostgreSQL Performance ────────────────────────────────
    - name: "PostgreSQL: Initialize pgbench (scale 50)"
      run: |
        PGPASSWORD=postgres pgbench -i -s 50 -h localhost -U postgres bench

    - name: "PostgreSQL: Read-only benchmark"
      run: |
        PGPASSWORD=postgres pgbench -h localhost -U postgres -S -c 10 -j $(nproc) -T 60 bench

    - name: "PostgreSQL: Read-write benchmark (TPC-B)"
      run: |
        PGPASSWORD=postgres pgbench -h localhost -U postgres -c 10 -j $(nproc) -T 60 bench
